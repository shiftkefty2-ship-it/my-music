<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Song</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .player {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: #1c1c1c;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 25px;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="player">
        <h1>🎵 My Song</h1>

        <audio controls loop>
            <source src="s.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
    </div>

</body>
</html>
